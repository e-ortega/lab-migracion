# Pipeline de ejemplo para el lab: multi-stage, variable group, environment con aprobacion
# y service connection a Azure. Es el "origen" que se convierte con el Actions Importer.
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: lab-vars            # variable group (se reemplaza por variables y secrets en GitHub)
  - name: nodeVersion
    value: '22.x'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: npm ci
            displayName: Install
          - script: npm run build
            displayName: Build
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: dist
              artifact: site

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: deploy
        environment: production   # tiene approval en ADO (se vuelve environment con required reviewers)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Check resource group
                  inputs:
                    azureSubscription: sc-azure-lab   # service connection (se vuelve OIDC)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: az group show --name $(resourceGroup) --query name -o tsv
